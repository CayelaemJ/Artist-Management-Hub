version: 2.1
jobs:
  verify:
    docker:
      - image: cimg/node:22-browsers
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install production dependencies
          command: npm install --omit=dev
      - run:
          name: Syntax and backend tests
          command: npm run check && npm test
      - run:
          name: Install isolated browser test runner
          command: npm install --no-save @playwright/test && npx playwright install chromium
      - run:
          name: Public read-only browser smoke tests
          command: npx playwright test --config=e2e/playwright.config.mjs
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
  security_suite:
    docker:
      - image: cimg/go:1.24
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Python runtime and prerequisites
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-venv curl
            python3 -m venv "$HOME/security-venv"
            echo 'export PATH="$HOME/security-venv/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Semgrep, Gitleaks, Trivy, optional Nuclei and Schemathesis
          command: bash .circleci/security.sh
          no_output_timeout: 15m
      - store_artifacts:
          path: security-reports
          destination: security-reports
          when: always
workflows:
  test:
    jobs:
      - verify

  security_audit:
    jobs:
      - security_suite:
          filters:
            branches:
              only: main
